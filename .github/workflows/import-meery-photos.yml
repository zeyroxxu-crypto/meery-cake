name: Import authentic Meery Cake gallery photos
on:
  push:
    paths:
      - '.github/workflows/import-meery-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate original Meery Cake photos
        run: |
          set -euo pipefail
          mkdir -p images
          curl --fail --location --retry 3 --max-time 30 -A "Mozilla/5.0" \
            'https://cdn.dev.iris-etourism.io/uploads/grand_carcassonne_v3/c6d/meery-cake-3.webp' \
            -o images/vitrine-meery.webp
          curl --fail --location --retry 3 --max-time 30 -A "Mozilla/5.0" \
            'https://cdn.iris-etourism.io/uploads/grand_carcassonne/3e8/meery-cake-1.webp' \
            -o images/patisseries-meery.webp
          python -m pip -q install pillow
          python - <<'PY'
          from PIL import Image
          for path in ['images/vitrine-meery.webp','images/patisseries-meery.webp']:
              im=Image.open(path)
              print(path, im.size, im.format)
              if im.width < 900 or im.height < 650:
                  raise RuntimeError('Image too small for premium gallery')
          PY
      - name: Commit photos as local files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/vitrine-meery.webp images/patisseries-meery.webp
          git diff --cached --quiet || (git commit -m "Add two authentic Meery Cake gallery photos as local assets" && git push)
