name: Importer les photos réelles de Meery Cake
on:
  push:
    paths:
      - '.github/workflows/importer-photos-meery.yml'
permissions:
  contents: write
jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Enregistrer les photographies dans le dépôt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images
          curl -fLsS --retry 3 --max-time 60 'https://www.grand-carcassonne-tourisme.fr/app/uploads/2024/01/meery-cake-5.webp' -o images/salon.webp
          curl -fLsS --retry 3 --max-time 60 'https://cdt11.media.tourinsoft.eu/upload/MEERY-CAKE-1.jpg' -o images/patisseries.jpg
          curl -fLsS --retry 3 --max-time 60 'https://cdt11.media.tourinsoft.eu/upload/MEERY-CAKE-2.jpg' -o images/brunch.jpg
          curl -fLsS --retry 3 --max-time 60 'https://crtlr.media.tourinsoft.eu/upload/meery-cake-4.jpg?width=770' -o images/cupcakes.jpg
          for path in images/salon.webp images/patisseries.jpg images/brunch.jpg images/cupcakes.jpg; do
            test "$(stat -c%s "$path")" -gt 10000
            file --mime-type "$path" | grep -Eq 'image/(jpeg|webp|png)'
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images
          git rm .github/workflows/importer-photos-meery.yml
          git commit -m "Store four genuine Meery Cake photos locally; remove temporary importer"
          git push
