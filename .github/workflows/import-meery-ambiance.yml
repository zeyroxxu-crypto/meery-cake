name: Import Meery Cake licensed ambience photography
on:
  push:
    paths:
      - '.github/workflows/import-meery-ambiance.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download authentic licensed photographs
        run: |
          set -euo pipefail
          mkdir -p images /tmp/meery-photos
          while read -r name photo; do
            echo "Fetching $name ($photo)"
            curl --fail --location --retry 3 --retry-delay 2 --max-time 65 -A "Mozilla/5.0" \
              "https://images.unsplash.com/$photo?auto=format&fm=jpg&fit=max&w=2200&q=88" \
              -o "/tmp/meery-photos/${name}.jpg"
            test "$(wc -c < "/tmp/meery-photos/${name}.jpg")" -gt 30000
          done <<'PHOTOS'
          fleurs-salon photo-1744206247888-5dea465db3ef
          gateau-cafe photo-1761291828835-819a3d0a7f5a
          cupcakes-rose photo-1595665099024-29af586ee3a1
          cupcake-fleurs photo-1643734561997-0ff22fd0bcb9
          gateau-fleurs photo-1557308536-ee471ef2c390
          vitrine-cafe photo-1774451606974-c18f05251594
          patisseries-rose photo-1578922794704-7bdd46f70ce0
          terrasse-fleurie photo-1775210563403-f653e7506e97
          dessert-macaron photo-1766634001820-24a6f1a85fb6
          service-the photo-1750265513387-7ae7b67c0740
          the-fleurs photo-1781612188993-fe06ff667f51
          PHOTOS
      - name: Validate original quality and self-host compressed WebP copies
        run: |
          python -m pip -q install pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          source=Path('/tmp/meery-photos')
          output=Path('images')
          photos=sorted(source.glob('*.jpg'))
          if len(photos)!=11: raise RuntimeError(f'Expected 11 genuine photographs, got {len(photos)}')
          for p in photos:
              im=Image.open(p)
              im=ImageOps.exif_transpose(im).convert('RGB')
              w,h=im.size
              if w<950 or h<650: raise RuntimeError(f'{p.name}: low resolution: {w}x{h}')
              im.thumbnail((1800,1800),Image.Resampling.LANCZOS)
              destination=output/f'ambiance-{p.stem}.webp'
              im.save(destination,format='WEBP',quality=84,method=6)
              if destination.stat().st_size<23000: raise RuntimeError(f'Suspicious small image: {destination}')
              print(destination,im.size,destination.stat().st_size)
          PY
      - name: Commit local photographs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ambiance-*.webp
          git diff --cached --quiet || (git commit -m "Add eleven licensed high resolution atmosphere photos as local files" && git push)
