/* Motion 6 - slow, perceptible transitions across the whole portal */
:root{--motion-slow:1100ms;--motion-ease:cubic-bezier(.16,1,.3,1)}
.v-login-art{animation:gradient 14s ease-in-out infinite!important}
.v-promo{animation:hero 1.6s var(--motion-ease) both}
.v-login-box{animation:hero 1.7s .25s var(--motion-ease) both}
.v-rolebar button{transition:transform .6s var(--motion-ease),background .6s,border-color .6s,box-shadow .6s!important}
.v-rolebar button:hover{transform:translateY(-6px) scale(1.035);box-shadow:0 12px 27px #24429d20}
.v-side{transition:width .9s var(--motion-ease),flex-basis .9s var(--motion-ease),box-shadow .9s!important}
.v-side:hover,.v-side:focus-within,.v-side.pinned{width:250px;flex-basis:250px}
.v-side-label{transition:opacity .75s ease,transform 1.05s var(--motion-ease)!important}
.v-side nav button{transition:transform .65s var(--motion-ease),background .65s,color .65s,box-shadow .65s!important}
.v-side nav button:hover{transform:translateX(9px) scale(1.02)}
.v-side nav button .v-nav-icon{transition:transform .75s var(--motion-ease),stroke .5s}
.v-side nav button:hover .v-nav-icon{transform:rotate(-11deg) scale(1.22)}
.v-page{animation:pageIn 1.25s var(--motion-ease) both!important;will-change:transform,opacity}
.v-page.out{animation:pageOut .66s cubic-bezier(.55,0,.8,.22) both!important}
.v-content{position:relative;overflow:clip}
.v-content:before{content:'';position:absolute;z-index:0;right:-80px;top:-85px;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,#b7dbff55,transparent 72%);animation:float 7s ease-in-out infinite alternate;pointer-events:none}
.v-page>.v-card,.v-page>.v-columns,.v-page>.v-stats{position:relative}
.v-banner{animation:gradient 13s ease-in-out infinite, bannerArrive 1.65s var(--motion-ease) both!important}
.v-banner h1{animation:slideFromLeft 1.5s .18s var(--motion-ease) both}
.v-banner p{animation:slideFromLeft 1.65s .35s var(--motion-ease) both}
.v-stat{animation:statArrive 1.3s var(--motion-ease) both!important;transition:transform .7s var(--motion-ease),box-shadow .7s!important}
.v-stats .v-stat:nth-child(1){animation-delay:.13s!important}
.v-stats .v-stat:nth-child(2){animation-delay:.27s!important}
.v-stats .v-stat:nth-child(3){animation-delay:.41s!important}
.v-stats .v-stat:nth-child(4){animation-delay:.55s!important}
.v-card{transition:transform .85s var(--motion-ease),box-shadow .7s,border-color .7s!important}
.v-card:hover{transform:translateY(-9px) scale(1.012)!important;box-shadow:0 24px 46px #15366b22!important}
.v-reveal{opacity:0!important;transform:translateY(52px) scale(.955)!important;filter:blur(5px);will-change:opacity,transform,filter}
.v-reveal.visible{opacity:1!important;transform:translateY(0) scale(1)!important;filter:blur(0);transition:opacity 1.35s var(--motion-ease),transform 1.35s var(--motion-ease),filter 1.2s ease!important}
.v-lesson{animation:lessonCascade 1.25s var(--motion-ease) both!important}
.v-lesson:nth-child(2){animation-delay:.16s!important}.v-lesson:nth-child(3){animation-delay:.32s!important}.v-lesson:nth-child(4){animation-delay:.48s!important}
.v-subject{transition:transform .75s var(--motion-ease),background .7s,border-color .7s,box-shadow .7s!important}
.v-subject.open{animation:subjectExpand .85s var(--motion-ease) both}
.v-progress>span{animation:grow 2.15s .4s var(--motion-ease) both!important}
.v-btn{transition:transform .6s var(--motion-ease),filter .55s,box-shadow .65s!important}
.v-btn:hover{transform:translateY(-5px) scale(1.035)}
.v-table tbody tr{animation:tableSlide 1s var(--motion-ease) both}
.v-table tbody tr:nth-child(2n){animation-delay:.06s}
.v-table tbody tr:nth-child(3n){animation-delay:.12s}
.v-item{transition:background .6s,transform .6s var(--motion-ease),padding-left .6s}
.v-item:hover{transform:translateX(7px);padding-left:10px;background:#f4f8ff;border-radius:8px}
.v-topright .v-avatar{animation:avatarFloat 5.5s ease-in-out infinite}
.v-topright .v-avatar:hover{animation:avatarRotate .9s var(--motion-ease) both}
.v-login-art:before{content:'';position:absolute;inset:-80%;pointer-events:none;background:conic-gradient(from 0deg,transparent 0%,#fff2 12%,transparent 22%,#fff2 43%,transparent 52%);animation:spinBackdrop 24s linear infinite;opacity:.28}

@keyframes pageIn{0%{opacity:0;transform:translate3d(95px,36px,0) scale(.96);filter:blur(12px)}65%{opacity:1;filter:blur(1px)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes pageOut{to{opacity:0;transform:translate3d(-130px,-12px,0) scale(.97);filter:blur(12px)}}

@media(max-width:660px){.v-side:hover,.v-side:focus-within,.v-side.pinned{width:190px;flex-basis:190px}.v-motion-indicator{bottom:9px;right:9px;padding:7px 10px}}
@media(prefers-reduced-motion:reduce){.v-page,.v-banner,.v-stat,.v-lesson,.v-table tbody tr,.v-reveal.visible,.v-topright .v-avatar{animation:none!important;transition:none!important;transform:none!important;filter:none!important}.v-reveal{opacity:1!important;transform:none!important;filter:none!important}.v-motion-indicator{display:none!important}}

.v-quiz-option input{accent-color:#5475e8;margin-right:7px}
.v-result{font-weight:800;border-radius:8px;padding:12px;background:#edf2ff;color:#3756a5;animation:quizIntro .8s both}
.v-result.right{background:#e4f9ee;color:#16815d}
.v-result.wrong{background:#fff3e5;color:#a66b1a}

mount.querySelectorAll("[data-edit-lesson]").forEach(b=>b.onclick=()=>{
 const lesson=db.lessons.find(l=>l.id===b.dataset.editLesson);if(!lesson||active.role==="student")return;
 const start=prompt("Nouvelle heure de début (HH:MM)",lesson.start);if(start===null)return;
 const end=prompt("Nouvelle heure de fin (HH:MM)",lesson.end);if(end===null)return;
 const room=prompt("Nouvelle salle",lesson.room);if(room===null)return;
 if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(start)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(end)||start>=end){change("Horaires invalides, utilisez HH:MM.");return}
 if(db.lessons.some(l=>l.id!==lesson.id&&l.classId===lesson.classId&&l.day===lesson.day&&start<l.end&&end>l.start)){change("Ce créneau chevauche un autre cours.");return}
 lesson.start=start;lesson.end=end;lesson.room=room.trim()||lesson.room;change("Cours modifié.");
});
mount.querySelectorAll("[data-delete-quiz]").forEach(b=>b.onclick=()=>{
 if(active.role==="student")return;
 const id=b.dataset.deleteQuiz;db.quizzes=db.quizzes.filter(q=>q.id!==id);
 Object.keys(db.quizAnswers).filter(k=>k.endsWith(":"+id)).forEach(k=>delete db.quizAnswers[k]);
 change("QCM supprimé.");
});
mount.querySelectorAll("[data-quiz]").forEach(f=>f.onsubmit=e=>{
 e.preventDefault();if(active.role!=="student")return;
 const chosen=f.elements.answer.value;
 if(chosen===""){change("Choisissez une réponse.");return}
 db.quizAnswers[active.id+":"+f.dataset.quiz]=Number(chosen);
 change("Votre réponse a été enregistrée.");
});
form("quiz-form",f=>{
 if(active.role==="student")return;
 const cls=currentClass(),subject=active.role==="teacher"?active.subject:f.subject.value;
 db.quizzes.push({id:key(),classId:cls,subject,title:f.title.value,question:f.question.value,options:[f.a.value,f.b.value,f.c.value,f.d.value],correct:Number(f.correct.value)});
 change("Nouveau QCM publié pour "+classNames[cls]+".");
});

mount.querySelectorAll("[data-color]").forEach(b=>b.onclick=()=>{db.theme=b.dataset.color;change("Couleur modifiée.")});
const colorCustom=mount.querySelector("#v-custom-color");if(colorCustom){colorCustom.value=/^#[0-9a-fA-F]{6}$/.test(db.theme)?db.theme:"#102c60";colorCustom.oninput=()=>{db.theme=colorCustom.value;document.documentElement.style.setProperty("--nav",db.theme)};colorCustom.onchange=()=>change("Couleur personnalisée enregistrée.");}
let rst=mount.querySelector("[data-reset]");if(rst)rst.onclick=()=>{db=base();change("Données de démonstration réinitialisées.")};
form("class-grades-form",f=>{const max=Number(f.max.value),coeff=Number(f.coeff.value),subject=active.role==="teacher"?active.subject:f.subject.value;if(!Number.isFinite(max)||max<=0||!Number.isFinite(coeff)||coeff<=0){change("Barème ou coefficient invalide.");return}const cls=students.filter(s=>s.classId===selectedClass);let rows=[],bad=false;for(const s of cls){let raw=f["grade_"+s.id].value.trim();if(!raw)continue;let v=Number(raw);if(!Number.isFinite(v)||v<0||v>max){bad=true;break}rows.push({id:key(),student:s.id,subject,title:f.title.value,value:v,max,coeff,date:new Date().toISOString().slice(0,10)})}if(bad){change("Une note est supérieure au barème ou invalide.");return}if(!rows.length){change("Renseignez au moins une note.");return}db.grades.push(...rows);change(rows.length+" notes publiées dans "+classNames[selectedClass]+".")});
form("lesson-form",f=>{const day=days.indexOf(f.day.value),start=f.start.value,end=f.end.value,subject=active.role==="teacher"?active.subject:f.subject.value;if(!start||!end||start>=end){change("Horaires incorrects.");return}if(db.lessons.some(l=>l.classId===selectedClass&&l.day===day&&start<l.end&&end>l.start)){change("Conflit : un autre cours est déjà prévu pour cette classe.");return}db.lessons.push({id:key(),classId:selectedClass,subject,day,start,end,room:f.room.value});change("Cours ajouté à "+classNames[selectedClass]+".")});
form("homework-form",f=>{db.homework.push({id:key(),classId:selectedClass,subject:active.role==="teacher"?active.subject:f.subject.value,title:f.title.value,due:f.due.value,details:f.details.value});change("Devoir publié pour "+classNames[selectedClass]+".")});
form("news-form",f=>{db.announcements.push({id:key(),title:f.title.value,body:f.body.value});change("Annonce publiée.")});
form("message-form",f=>{db.messages.push({id:key(),to:f.to.value,from:active.id,subject:f.subject.value,body:f.body.value,read:false});change("Message envoyé dans la démonstration.")});
form("attendance-form",f=>{db.attendance.push({id:key(),student:currentStudent(),type:f.type.value,date:f.date.value,reason:f.reason.value});change("Événement enregistré.")});
form("resource-form",f=>{const url=f.url.value.trim();if(!url.startsWith("https://")){change("Lien HTTPS requis.");return}db.resources.push({id:key(),title:f.title.value,subject:f.subject.value,url});change("Ressource ajoutée.")});
form("settings-form",f=>{db.school=f.school.value.trim()||"Établissement de démonstration";change("Nom de l'établissement mis à jour.")});
}catch(err){mount.innerHTML='<main style="padding:30px"><h2>Erreur d’affichage</h2><p>'+esc(err.message)+'</p><button id="recover" class="v-btn">Revenir à l’accueil</button></main>';let b=mount.querySelector("#recover");if(b)b.onclick=()=>{page="Accueil";render()}}
}
login();intro();
})();</script></body></html>
