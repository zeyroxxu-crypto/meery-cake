function login(){
document.title='Connexion — Scolia';
app.innerHTML='<div class="login"><section class="login-left"><div class="logo"><i>S</i> scolia</div><div class="login-hero"><div style="font-size:11px;letter-spacing:2px;font-weight:800;color:#b7d3ff">L’ÉCOLE, AUTREMENT</div><h1>Un espace.<br>Toute la vie scolaire.</h1><p>Une interface claire et animée pour les élèves et les enseignants.</p></div><small style="color:#c6dbff">Plateforme de démonstration — Scolia</small><div class="orb"></div></section><section class="login-right"><div class="login-box"><span class="eyebrow">PORTAIL DE VIE SCOLAIRE</span><h2>Bienvenue sur Scolia.</h2><p class="muted">Connectez-vous avec un compte de démonstration.</p><div class="rolebar">'+[['eleve','Élève'],['prof','Professeur'],['direction','Direction']].map(x=>'<button type="button" data-role="'+x[0]+'" class="'+(loginRole===x[0]?'active':'')+'">'+x[1]+'</button>').join('')+'</div><form id="login-form">'+field('Identifiant','name','text','value="'+loginRole+'" autocomplete="off"')+field('Mot de passe','password','password','autocomplete="off"')+'<div id="login-error" class="error"></div><button class="primary" style="width:100%">Se connecter</button></form><div class="hint"><b>Identifiants de démonstration</b><br>Élève : eleve / demo123<br>Professeur : prof / prof123<br>Direction : direction / admin123</div><p class="muted">N’utilisez jamais vos identifiants réels ÉcoleDirecte.</p></div></section></div>';
const f=app.querySelector('#login-form');
app.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{loginRole=b.dataset.role;login()});
f.onsubmit=e=>{e.preventDefault();let k=f.elements.name.value.trim().toLowerCase();if(persons[k]&&f.elements.password.value===persons[k].pass){user=k;page='Accueil';feedback='';render()}else app.querySelector('#login-error').textContent='Identifiant ou mot de passe incorrect.'};
}
function dashboard(){
const avg=overall();
return '<div class="banner"><div style="font-size:12px;color:#d8e7ff">'+safe(data.school)+' · Portail scolaire 2026–2027</div><h1>Bonjour, '+safe(persons[user].name.split(' ')[0])+' !</h1><p>Retrouvez toutes vos informations scolaires.</p></div><div class="grid4">'+[['Moyenne générale',avg===null?'—':fmt(avg)+'/20','#4775eb'],['Cours programmés',data.lessons.length,'#15aabc'],['Devoirs à faire',data.homework.filter(h=>!data.done[h.id]).length,'#efa346'],['Messages non lus',data.messages.filter(m=>m.to===user&&!m.read).length,'#1aa682']].map(v=>'<div class="stat" style="--color:'+v[2]+'"><div class="muted">'+v[0]+'</div><div class="big">'+v[1]+'</div></div>').join('')+'</div><div class="grid2">'+panel('<div class="row"><h3>Quoi de neuf ?</h3><button class="secondary" data-page="Vie de la classe">Tout voir</button></div>'+(data.news.length?data.news.slice(-4).reverse().map(x=>row(x.title,x.body.slice(0,125))).join(''):empty('Aucune annonce','Les actualités apparaîtront ici.')))+panel('<div class="row"><h3>Prochains cours</h3><button class="secondary" data-page="Emploi du temps">Planning</button></div>'+(data.lessons.length?data.lessons.slice().sort((a,b)=>a.day-b.day||a.start.localeCompare(b.start)).slice(0,4).map(x=>row(x.subject,days[x.day]+' · '+x.start+'–'+x.end+' · '+x.room)).join(''):empty('Planning vide','Les cours apparaissent après publication.')))+'</div><div class="grid2">'+panel('<div class="row"><h3>Devoirs</h3><button class="secondary" data-page="Cahier de textes">Voir tout</button></div>'+(data.homework.length?data.homework.slice(-4).reverse().map(x=>row(x.title,x.subject+' · '+x.due)).join(''):empty('Aucun devoir','Le cahier de textes est vide.')))+panel('<div class="row"><h3>Résultats</h3><button class="secondary" data-page="Notes">Notes</button></div>'+(avg===null?empty('Aucune moyenne','Une note publiée suffit pour commencer le calcul.'):'<p style="font-size:33px;font-weight:850;color:#4775eb">'+fmt(avg)+'/20</p><div class="progress"><span style="--percent:'+avg*5+'%"></span></div>'))+'</div>';
}
function notes(){let av=overall(),subs=bySubject();return '<h1>Notes et moyennes</h1><p class="muted">Suivi des notes et calcul automatique des moyennes.</p><div class="grid2">'+panel('<h3>Moyenne générale</h3><div style="font-size:34px;font-weight:850;color:#4775eb">'+(av===null?'—':fmt(av)+'/20')+'</div><p class="muted">'+data.grades.length+' évaluation(s)</p>')+panel('<h3>Matières</h3>'+(subs.length?subs.map((s,i)=>'<div class="entry"><div class="row"><b>'+safe(s.subject)+'</b><b>'+fmt(s.value)+'/20</b></div><div class="progress"><span style="--percent:'+s.value*5+'%;--color:'+['#4775eb','#1caeaa','#efa346','#a56bd9'][i%4]+'"></span></div></div>').join(''):empty('Aucune note','Les enseignants peuvent publier les premières évaluations.')))+'</div>'+panel('<h3>Détail des évaluations</h3>'+(data.grades.length?'<div class="tablewrap"><table><thead><tr><th>Matière</th><th>Évaluation</th><th>Note</th><th>Coefficient</th></tr></thead><tbody>'+data.grades.slice().reverse().map(g=>'<tr><td>'+safe(g.subject)+'</td><td>'+safe(g.title)+'</td><td><b>'+fmt(g.value)+'/'+fmt(g.max)+'</b></td><td>'+fmt(g.coeff)+'</td></tr>').join('')+'</tbody></table></div>':empty('Pas encore de notes','Les résultats apparaîtront ici.')))+(staff()?'<div class="spacer"></div>'+panel('<h3>Publier une évaluation</h3><form id="grade-form" class="formgrid">'+select('Matière','subject',subjects)+field('Intitulé','title','text','maxlength="90"')+field('Note obtenue','value','number','min="0" step="0.25"')+field('Barème','max','number','min="1" value="20" step="0.25"')+field('Coefficient','coeff','number','min="0.25" value="1" step="0.25"')+'<button class="primary">Publier la note</button></form>'):'');
}
function timetable(){return '<h1>Emploi du temps</h1><p class="muted">Les cours de la semaine, organisés par créneau.</p>'+panel('<div class="week">'+days.map((day,i)=>'<div><div class="dayhead">'+day.slice(0,3)+'</div>'+data.lessons.filter(l=>l.day===i).sort((a,b)=>a.start.localeCompare(b.start)).map(l=>'<div class="lesson" style="--color:'+['#ef564a','#45c5d4','#5278e8','#23a88c'][subjects.indexOf(l.subject)%4]+'">'+safe(l.start)+'<b>'+safe(l.subject)+'</b>'+safe(l.end)+'<p>'+safe(l.room)+'</p></div>').join('')+'</div>').join('')+'</div>'+(data.lessons.length?'':empty('Aucun cours','Le professeur peut créer des créneaux.')))+(staff()?'<div class="spacer"></div>'+panel('<h3>Ajouter un cours</h3><form id="lesson-form" class="formgrid">'+select('Matière','subject',subjects)+select('Jour','day',days)+field('Début','start','time','value="08:00"')+field('Fin','end','time','value="09:00"')+field('Salle','room','text','value="B201"')+'<button class="primary">Ajouter le cours</button></form>'):'');
}
function homework(){return '<h1>Cahier de textes</h1><p class="muted">Consignes de travail et dates de rendu.</p>'+panel(data.homework.length?data.homework.slice().reverse().map(h=>'<label class="entry" style="display:flex;gap:13px;align-items:start;cursor:pointer"><input type="checkbox" data-done="'+h.id+'" '+(data.done[h.id]?'checked':'')+' style="margin-top:3px;accent-color:#4775eb"><span><b>'+safe(h.title)+'</b><p>'+safe(h.subject)+' · '+safe(h.due)+'</p><p>'+safe(h.description)+'</p></span></label>').join(''):empty('Pas de devoirs','Les devoirs publiés apparaîtront ici.'))+(staff()?'<div class="spacer"></div>'+panel('<h3>Publier un devoir</h3><form id="homework-form" class="formgrid">'+select('Matière','subject',subjects)+field('Titre','title','text','maxlength="100"')+field('Date de rendu','due','date')+'<label class="field-label" style="grid-column:1/-1">Consignes<textarea class="field" name="description" rows="3" maxlength="500"></textarea></label><button class="primary">Publier</button></form>'):'');
}
function news(){return '<h1>Vie de la classe</h1><p class="muted">Annonces et informations de l’établissement.</p>'+panel(data.news.length?data.news.slice().reverse().map(x=>row(x.title,x.body)).join(''):empty('Aucune annonce','La direction et les enseignants peuvent publier des informations.'))+(staff()?'<div class="spacer"></div>'+panel('<h3>Nouvelle annonce</h3><form id="news-form">'+field('Titre','title','text','maxlength="110"')+'<label class="field-label">Message<textarea class="field" name="body" rows="4" maxlength="1500" required></textarea></label><button class="primary">Publier</button></form>'):'');
}
function messages(){const list=data.messages.filter(m=>m.to===user);return '<h1>Messagerie</h1><p class="muted">Échanges entre les profils de démonstration.</p>'+panel(list.length?list.slice().reverse().map(m=>'<div class="entry"><div class="row"><b>'+safe(persons[m.from].name)+'</b><span class="pill">'+(m.read?'Lu':'Nouveau')+'</span></div><b>'+safe(m.subject)+'</b><p>'+safe(m.body)+'</p><button class="secondary" data-read="'+m.id+'">Marquer comme lu</button></div>').join(''):empty('Aucun message','La boîte de réception est vide.'))+'<div class="spacer"></div>'+panel('<h3>Rédiger un message</h3><form id="message-form" class="formgrid">'+select('Destinataire','to',Object.keys(persons).filter(k=>k!==user))+field('Objet','subject','text','maxlength="100"')+'<label class="field-label" style="grid-column:1/-1">Message<textarea class="field" name="body" rows="3" maxlength="1000" required></textarea></label><button class="primary">Envoyer</button></form>');
}
function life(){return '<h1>Vie scolaire</h1><p class="muted">Absences, retards et suivi administratif.</p>'+panel(data.absences.length?data.absences.slice().reverse().map(x=>row(x.type,x.date+' · '+x.reason)).join(''):empty('Aucun événement','Aucune absence ni aucun retard enregistré.'))+(staff()?'<div class="spacer"></div>'+panel('<h3>Ajouter un événement</h3><form id="absence-form" class="formgrid">'+select('Type','type',['Absence','Retard'])+field('Date','date','date')+field('Motif','reason','text','maxlength="150"')+'<button class="primary">Enregistrer</button></form>'):'');
}
function documents(){return '<h1>Documents</h1><p class="muted">Ressources pédagogiques partagées.</p>'+panel(data.documents.length?data.documents.slice().reverse().map(x=>'<div class="entry row"><div><b>'+safe(x.title)+'</b><p>'+safe(x.subject)+'</p></div><button class="secondary" data-document="'+x.id+'">Ouvrir</button></div>').join(''):empty('Aucun document','Les ressources seront partagées ici.'))+(staff()?'<div class="spacer"></div>'+panel('<h3>Ajouter une ressource</h3><form id="document-form" class="formgrid">'+field('Titre','title','text','maxlength="100"')+select('Matière','subject',subjects)+field('Lien HTTPS','url','url','placeholder="https://..."')+'<button class="primary">Partager</button></form>'):'');
}
function settings(){return '<h1>Paramètres</h1><p class="muted">Personnalisez Scolia pour votre établissement.</p>'+panel('<h3>Apparence</h3><p class="muted">Couleur du menu animé</p><div style="margin:16px 0">'+['#102c60','#413897','#177d87','#16715d','#8e4779','#a4523c'].map(c=>'<button class="swatch" data-color="'+c+'" style="background:'+c+'" aria-label="Couleur '+c+'"></button>').join('')+'</div><form id="settings-form">'+field('Nom affiché','school','text','value="'+safe(data.school)+'" maxlength="70"')+'<button class="primary" style="margin-top:13px">Enregistrer</button></form>')+'<div class="spacer"></div>'+panel('<h3>Compte utilisateur</h3><b>'+safe(persons[user].name)+'</b><p class="muted">'+safe(persons[user].type)+' · Compte fictif</p><button class="secondary" data-logout="1">Déconnexion</button>')+'<div class="spacer"></div>'+panel('<h3>Données de démonstration</h3><p class="muted">Les données sont conservées dans ce navigateur uniquement. Les comptes affichés ne sont pas de véritables identités sécurisées.</p>'+(user==='direction'?'<button class="secondary" data-reset="1">Réinitialiser</button>':''));
}
function placeholder(){return '<h1>'+safe(page)+'</h1><p class="muted">Une rubrique de vie scolaire.</p>'+panel(empty('En préparation','Cette rubrique est visible mais pas encore fonctionnelle dans le prototype.'))}

'Vie de la classe':'<path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M20 20v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
'Notes':'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
'Messagerie':'<rect x="2" y="4" width="20" height="16" rx="3"/><path d="m3 6 9 7 9-7"/>',

'Cahier de textes':'<path d="M4 19.5V4a2 2 0 0 1 2-2h14v18H6a2 2 0 0 1 0-4h14M8 7h8M8 11h6"/>',
'QCM':'<path d="M9 11l2 2 4-4"/><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 17h10"/>',

'Carnet de correspondance':'<path d="M4 4h16v16H4zM8 4v16M11 9h6M11 13h6"/>',
'Documents':'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h8"/>',
'Espaces de travail':'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M2 12h20M10 12v3h4v-3"/>',
'Mon cloud':'<path d="M20 17a4 4 0 0 0-1-7.87 7 7 0 0 0-13.4-1.3A5 5 0 0 0 7 18h13"/>',
'Paramètres':'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.9 2.9-.07-.06a1.7 1.7 0 0 0-1.88-.34l-.09.04V21h-4v-1.52l-.09-.04a1.7 1.7 0 0 0-1.88.34l-.07.06-2.9-2.9.06-.06A1.7 1.7 0 0 0 6.32 15l-.04-.09H4.75v-4h1.53l.04-.09A1.7 1.7 0 0 0 5.98 9l-.06-.07 2.9-2.9.07.06a1.7 1.7 0 0 0 1.88.34l.09-.04V4.75h4v1.64l.09.04a1.7 1.7 0 0 0 1.88-.34l.07-.06 2.9 2.9-.06.07a1.7 1.7 0 0 0-.34 1.82l.04.09h1.53v4h-1.53z"/>'

function enhanceUI(){
 app.querySelectorAll('.nav button[data-page]').forEach(b=>{
   const icon=b.querySelector('.ico');
   if(icon&&svgPaths[b.dataset.page])icon.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+svgPaths[b.dataset.page]+'</svg>';
 });
 let cards=app.querySelectorAll('.main .panel,.main .stat');
 if('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
   const observer=new IntersectionObserver(entries=>{
     entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-visible');observer.unobserve(e.target)}});
   },{threshold:.06,rootMargin:'0px 0px 60px 0px'});
   cards.forEach((c,i)=>{c.classList.add('reveal');c.style.transitionDelay=Math.min(i%4,3)*.09+'s';observer.observe(c)});
 }
}
let pageChanging=false;
function movePage(next){
 if(pageChanging||next===page)return;
 pageChanging=true;
 const currentMain=app.querySelector('.main');
 if(currentMain&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  currentMain.classList.add('page-leaving');
  setTimeout(()=>{page=next;feedback='';render();window.scrollTo({top:0,behavior:'smooth'});pageChanging=false},260);
 }else{page=next;feedback='';render();pageChanging=false}
}
function intro(){
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const layer=document.createElement('div');layer.className='loading-overlay';
 layer.innerHTML='<div class="loading-inner"><div class="loading-symbol">S</div><div class="loading-title">scolia</div><div style="font-size:12px;letter-spacing:1.5px;opacity:.8;margin-top:8px">LA VIE SCOLAIRE, PLUS FLUIDE</div><div class="loading-line"><span></span></div></div>';
 document.body.appendChild(layer);
 setTimeout(()=>layer.classList.add('out'),1450);
 setTimeout(()=>layer.remove(),2200);
}

const pages={'Accueil':dashboard,'Vie scolaire':life,'Vie de la classe':news,'Notes':notes,'Messagerie':messages,'Emploi du temps':timetable,'Cahier de textes':homework,'Documents':documents,'Paramètres':settings};
function wire(k,fn){let form=app.querySelector('#'+k);if(form)form.onsubmit=e=>{e.preventDefault();fn(form.elements)}}
function render(){
if(!user){login();return}
document.title=page+' — Scolia';document.documentElement.style.setProperty('--nav',data.color||'#102c60');
try{
const items=nav.map(([name,ico])=>'<button title="'+name+'" data-page="'+name+'" class="'+(page===name?'active':'')+'"><span class="ico">'+ico+'</span><span class="label">'+name+'</span></button>').join('');
app.innerHTML='<div class="shell"><aside class="side" aria-label="Navigation"><div class="side-brand"><span class="mark">S</span><span class="label" style="font-weight:850;font-size:20px">scolia</span></div><nav class="nav">'+items+'</nav><div class="side-bottom"><button data-logout="1"><span class="ico">↪</span><span class="label">Déconnexion</span></button></div></aside><div class="workspace"><header class="top"><div><span class="eyebrow">SCOLIA · '+safe(persons[user].type.toUpperCase())+'</span><br><strong>'+safe(data.school)+'</strong></div><div class="top-right"><span class="badge">DÉMO</span><button class="secondary" data-page="Paramètres">⚙ Paramètres</button><span class="avatar">'+safe(persons[user].name.split(' ').map(n=>n[0]).join('').slice(0,2))+'</span></div></header><main class="main animate">'+(feedback?'<div class="toast">'+safe(feedback)+'</div>':'')+(pages[page]||placeholder)()+'</main></div></div>';
enhanceUI();
app.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>movePage(b.dataset.page));
app.querySelectorAll('[data-logout]').forEach(b=>b.onclick=()=>{user=null;feedback='';login()});
app.querySelectorAll('[data-done]').forEach(b=>b.onchange=()=>{data.done[b.dataset.done]=b.checked;commit('Devoir mis à jour.')});
app.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{let m=data.messages.find(x=>x.id===b.dataset.read);if(m&&m.to===user){m.read=true;commit('Message marqué comme lu.')}});
app.querySelectorAll('[data-document]').forEach(b=>b.onclick=()=>{let d=data.documents.find(x=>x.id===b.dataset.document);if(d&&d.url.startsWith('https://'))window.open(d.url,'_blank','noopener,noreferrer')});
app.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{data.color=b.dataset.color;commit('Couleur du menu modifiée.')});
const reset=app.querySelector('[data-reset]');if(reset)reset.onclick=()=>{data=initial();commit('Démonstration réinitialisée.')};
wire('grade-form',f=>{const v=+f.value.value,m=+f.max.value,c=+f.coeff.value;if(!Number.isFinite(v)||!Number.isFinite(m)||!Number.isFinite(c)||v<0||m<=0||v>m||c<=0){feedback='Note, barème ou coefficient incorrect.';render();return}data.grades.push({id:id(),subject:f.subject.value,title:f.title.value,value:v,max:m,coeff:c});commit('Note publiée. Les moyennes sont recalculées.')});
wire('lesson-form',f=>{let day=days.indexOf(f.day.value),a=f.start.value,b=f.end.value;if(!a||!b||a>=b){feedback='Horaires invalides.';render();return}if(data.lessons.some(x=>x.day===day&&a<x.end&&b>x.start)){feedback='Conflit : un cours est déjà prévu.';render();return}data.lessons.push({id:id(),subject:f.subject.value,day,start:a,end:b,room:f.room.value});commit('Cours ajouté au planning.')});
wire('homework-form',f=>{data.homework.push({id:id(),subject:f.subject.value,title:f.title.value,due:f.due.value,description:f.description.value});commit('Devoir publié.')});
wire('news-form',f=>{data.news.push({id:id(),title:f.title.value,body:f.body.value});commit('Actualité publiée.')});
wire('message-form',f=>{data.messages.push({id:id(),from:user,to:f.to.value,subject:f.subject.value,body:f.body.value,read:false});commit('Message enregistré dans la démo.')});
wire('absence-form',f=>{data.absences.push({id:id(),type:f.type.value,date:f.date.value,reason:f.reason.value});commit('Événement enregistré.')});
wire('document-form',f=>{if(!f.url.value.startsWith('https://')){feedback='Utilisez un lien HTTPS.';render();return}data.documents.push({id:id(),title:f.title.value,subject:f.subject.value,url:f.url.value});commit('Ressource partagée.')});
wire('settings-form',f=>{data.school=f.school.value.trim()||'Mon établissement';commit('Nom mis à jour.')});
}catch(e){app.innerHTML='<main style="padding:40px"><h2>Problème de chargement</h2><p>'+safe(e.message)+'</p><button class="primary" id="recover">Revenir à l’accueil</button></main>';app.querySelector('#recover').onclick=()=>{page='Accueil';render()}}
}
login();
intro();
})();
</script></body></html>
